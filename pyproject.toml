[project]
name = "mithili-bert"
version = "0.1.0"
description = "Ollama-backed extractive summarization for Maithili text"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "sacrebleu>=2.6.0",
    "scikit-learn>=1.8.0",
    "sentencepiece>=0.2.1",
    "torch>=2.11.0",
    "transformers>=5.7.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
